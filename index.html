const rows=[];for(let m=0;m<12;m++){const d=new Date(2026,9-m,0).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'});rows.push({t:'Employer contribution',k:'Employer',a:56000,d,m},{t:'Employee contribution',k:'Employee',a:42000,d,m})}
const series=n=>Array.from({length:n},(_,i)=>i===n-1?BAL:BAL*Math.exp(-(n-1-i)*0.0115)*(1+0.012*Math.sin(i*1.9)));

return html`<button onClick=${()=>go('onb')} aria-label="Continue" className="flex-1 grid place-items-center bg-white relative"><${Pattern}/><div className="relative text-center"><div className="flex justify-center rise"><${Logo} c="h-24"/></div><p className="mt-4 text-sm text-p font-semibold rise2">Progress you can feel</p></div><p className="absolute bottom-8 text-xs text-ink px-6 text-center">Concept design with demo data. Not an official FCMB product.</p></button>`};

const Onb=({go})=>{const[i,setI]=useState(0);const S=[['See your savings clearly','Your RSA balance, contributions and gains in one calm, easy view.','chart'],['Watch your savings grow','Follow how steady contributions build your retirement over the years.','up'],['Safe, private, in your control','Sign in with your fingerprint. We never ask for your password by phone or SMS.','shield']];const[t,d,ic]=S[i];
return html`<div className="flex-1 flex flex-col p-6 bg-mist"><div className="flex justify-between items-center"><${Logo} c="h-9"/><button onClick=${()=>go('login')} className="min-h-[44px] px-2 font-bold text-p">Skip</button></div><${Hero} cls="mt-2 h-60 grid place-items-center fade" key=${i}><div className="text-center"><span className="w-20 h-20 rounded-full bg-white/10 grid place-items-center mx-auto mb-5"><${I} n=${ic} c="w-10 h-10"/></span><div className="flex justify-center"><${Bars} w="w-14"/></div></div><//><h1 className="font-d text-[2rem] leading-tight mt-8" key=${'t'+i}>${t}</h1><p className="text-ink mt-3 text-base">${d}</p><div className="flex gap-2 my-6" aria-label=${'Step '+(i+1)+' of 3'}>${S.map((_,k)=>html`<i key=${k} className=${'h-2 rounded-full transition-all '+(k===i?'w-8 bg-p':'w-2 bg-[#cdbfdb]')}></i>`)}</div><div className="mt-auto"><${Btn} onClick=${()=>i<2?setI(i+1):go('login')}>${i<2?'Next':'Get started'}<//></div></div>`};

const Login=({go})=>{const{toast}=useContext(Ctx);const[pin,setPin]=useState(ME.pin);const[pw,setPw]=useState('demo1234');const[show,setShow]=useState(false);const[err,setErr]=useState({});const[ld,setLd]=useState(false);const[bio,setBio]=useState(false);const[fg,setFg]=useState(false);const[sent,setSent]=useState(false);
const sub=e=>{e.preventDefault();const x={};if(!pin.trim())x.pin='Enter your RSA PIN or email';if(pw.length<6)x.pw='Enter your password (at least 6 characters)';setErr(x);if(Object.keys(x).length)return;setLd(true);setTimeout(()=>{setLd(false);toast('Welcome back, '+ME.first);go('home')},900)};

return html`<div className="flex-1 overflow-y-auto bg-mist p-6 pt-8"><div className="mb-6"><${Logo} c="h-12"/></div><h1 className="font-d text-[2rem] leading-tight">Welcome back</h1><p className="text-ink mb-5">Sign in to see how your savings are growing.</p>
<form onSubmit=${sub} noValidate><${Field} label="RSA PIN or email" value=${pin} onChange=${e=>setPin(e.target.value)} err=${err.pin} autoComplete="username"/><div className="relative"><${Field} label="Password" type=${show?'text':'password'} value=${pw} onChange=${e=>setPw(e.target.value)} err=${err.pw} placeholder="Any 6+ characters (demo)" autoComplete="current-password"/><button type="button" onClick=${()=>setShow(!show)} aria-label="Show or hide password" className="absolute right-1 top-[26px] w-12 h-14 grid place-items-center text-ink"><${I} n="eye"/></button></div>
<div className="text-right mb-5"><button type="button" onClick=${()=>{setSent(false);setFg(true)}} className="min-h-[44px] font-bold text-p">Forgot password?</button></div>
<${Btn} type="submit" disabled=${ld}>${ld?html`<span className="w-5 h-5 rounded-full border-2 border-white/40 border-t-white animate-spin"></span> Signing in`:'Sign in'}<//></form>

if(s===3)return html`<div className="flex-1 grid place-items-center p-6 text-center bg-mist fade"><div><span className="w-20 h-20 rounded-full bg-jade grid place-items-center mx-auto"><${I} n="check" c="w-10 h-10"/></span><h1 className="font-d text-3xl mt-5">Account activated</h1><p className="text-ink my-3">You’re all set. Sign in to see your savings.</p><${Btn} onClick=${()=>go('login')}>Continue to sign in<//></div></div>`;

return html`<div className="flex-1 overflow-y-auto bg-mist"><${Top} title="Activate" back="login" go=${go}/><div className="px-5"><div className="flex gap-2 mb-4">${[0,1,2].map(k=>html`<i key=${k} className=${'h-1.5 flex-1 rounded-full '+(k<=s?'bg-p':'bg-[#d9cfe3]')}></i>`)}</div><h2 className="font-d text-2xl mb-4">${T[s]}</h2>
${s===0&&html`<div><${Field} label="RSA PIN" value=${f.pin} onChange=${set('pin')} err=${e.pin} placeholder="PEN100456789012"/><${Field} label="Mobile number" value=${f.ph} onChange=${set('ph')} err=${e.ph} inputMode="tel" placeholder="0801 234 5678"/></div>`}
${s===1&&html`<div><p className="text-ink mb-3">We’d send a 6-digit code to your phone. Demo code: <b>123456</b></p><${Field} label="Verification code" value=${f.code} onChange=${set('code')} err=${e.code} inputMode="numeric" maxLength="6"/></div>`}

<${Btn} onClick=${next}>${s===2?'Activate account':'Continue'}<//></div></div>`};

<div className="grid grid-cols-4 gap-2 mb-5">${Q.map(([i,t,fn])=>html`<button key=${t} onClick=${fn} className="flex flex-col items-center gap-1.5 min-h-[44px]"><span className="w-14 h-14 rounded-2xl bg-white grid place-items-center text-p"><${I} n=${i}/></span><span className="text-xs font-semibold">${t}</span></button>`)}</div>
<div className="flex justify-between items-center mb-2"><h2 className="font-d text-xl">Recent activity</h2><button onClick=${()=>go('contrib')} className="font-bold text-sm text-p min-h-[44px]">View all</button></div>${rows.slice(0,3).map((r,i)=>html`<${Row} key=${i} t=${r.t} d=${r.d} a=${'₦'+r.a.toLocaleString()}/>`)}</div>`}</div>
<${Sheet} open=${vol===-1||vol>=0&&vol!==undefined&&vol>0||vol===0&&false} onClose=${()=>setVol(0)} title="Add voluntary savings">${vol===2?html`<div className="text-center"><span className="w-14 h-14 rounded-full bg-jade grid place-items-center mx-auto"><${I} n="check" c="w-7 h-7"/></span><p className="mt-3 font-bold">Request received</p><p className="text-ink text-sm mb-4">Demo only. No payment was made.</p><${Btn} onClick=${()=>setVol(0)}>Done<//></div>`:vol===1?html`<div className="text-center py-8"><span className="inline-block w-10 h-10 rounded-full border-4 border-[#e8dcf2] border-t-p animate-spin"></span><p className="text-ink mt-3">Processing</p></div>`:html`<div><div className="flex gap-2 mb-4">${[10000,25000,50000].map(a=>html`<button key=${a} onClick=${()=>setAmt(a)} className=${'flex-1 min-h-[48px] rounded-xl font-bold border-2 '+(amt===a?'bg-p text-white border-p':'border-[#d9cfe3]')}>₦${a.toLocaleString()}</button>`)}</div><${Btn} onClick=${run}>Continue with ₦${amt.toLocaleString()}<//></div>`}<//>
<${Sheet} open=${nt} onClose=${()=>setNt(false)} title="Notifications">${unread?html`<div>${[['Employer contribution received','₦56,000 · Sep 30, 2026'],['Reminder: review your statement','Your quarterly statement is ready'],['Security tip','We never ask for your password by phone']].map(([a,b])=>html`<div key=${a} className="py-3 border-b border-[#eee7f4]"><div className="font-bold text-sm">${a}</div><div className="text-xs text-ink">${b}</div></div>`)}<div className="mt-4"><${Btn} kind="o" onClick=${()=>setUn(false)}>Mark all as read<//></div></div>`:html`<div className="text-center py-8"><span className="w-14 h-14 rounded-full bg-mist grid place-items-center mx-auto text-p"><${I} n="check" c="w-7 h-7"/></span><p className="font-bold mt-3">You’re all caught up</p><p className="text-sm text-ink">New reminders will show here.</p></div>`}<//></div>`};

return html`<div className="flex-1 overflow-y-auto bg-mist pb-4"><${Top} title="RSA details" back="home" go=${go}/><div className="px-5 fade"><${Hero} cls="mb-3"><div className="text-sm opacity-90">Retirement Savings Account</div><div className="font-d text-4xl mt-1">${fmt(BAL)}</div><div className="flex gap-6 mt-4 text-sm"><div><div className="opacity-80 text-xs">Contributions</div>${fmt(CONT)}</div><div><div className="opacity-80 text-xs">Gains</div>${fmt(GAIN)}</div></div><//>

const Chart=({v})=>{const W=330,H=150,mn=Math.min(...v)*.95,mx=Math.max(...v);const P=v.map((y,i)=>[i/(v.length-1)*W,H-(y-mn)/(mx-mn)*(H-14)-4]);const d=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');const e=P[P.length-1];

const noop=()=>{};
const Static=({k,C})=>html`<${Ctx.Provider} value=${{toast:noop,big:false,setBig:noop}}><div className="relative w-[393px] h-[852px] rounded-[48px] overflow-hidden bg-mist flex flex-col pt-[54px] shadow-[0_1px_3px_rgba(0,0,0,.2),0_16px_44px_rgba(0,0,0,.16)] pointer-events-none select-none"><${Chrome}/><${C} go=${noop}/>${NAVS.includes(k)&&html`<${Nav} s=${k} go=${noop}/>`}</div><//>`;
const Arr=()=>html`<div className="flex items-center w-[120px] shrink-0 self-center text-[#0d99ff]"><i className="w-2.5 h-2.5 rounded-full bg-current"></i><i className="flex-1 h-[2px] bg-current"></i><svg width="10" height="12" viewBox="0 0 10 12" fill="currentColor"><path d="M0 0l10 6-10 6z"/></svg></div>`;
const Flow=({a,b,t})=>html`<div className="mb-24"><h3 className="text-lg font-semibold text-[#333] mb-5">${t}</h3><div className="flex items-start">${SCR.slice(a,b).map(([k,n,C],i)=>html`<${React.Fragment} key=${k}>${i>0&&html`<${Arr}/>`}<div><div className="text-[13px] text-[#555] mb-3">iPhone 16 · ${String(a+i+1).padStart(2,'0')} ${n}</div><${Static} k=${k} C=${C}/></div><//>`)}</div></div>`;
const Guide=()=>html`<div className="w-[1100px] bg-white rounded-2xl p-10 mb-20 pointer-events-none select-none shadow-[0_1px_3px_rgba(0,0,0,.15)]"><div className="flex justify-between items-start mb-8"><div><div className="text-xs text-ink mb-1">Style guide</div><h2 className="font-d text-4xl">FCMB Pensions app redesign</h2><p className="text-ink mt-1">Progressive brilliance: the two gold bars grow with the customer’s savings.</p></div><${Logo} c="h-14"/></div>
<div className="flex gap-5 mb-9">${[['Purple','#5c068c'],['Obsidian','#2e0b56'],['Gold','#ffb81c'],['Jade','#3de896'],['Coral','#ff859f'],['Teal','#00a6d3'],['Mist','#f7f5fa']].map(([n,c])=>html`<div key=${n}><i className="block w-[120px] h-24 rounded-2xl border border-black/10" style=${{background:c}}></i><div className="text-sm font-semibold mt-2">${n}</div><div className="text-xs text-ink">${c}</div></div>`)}</div>
<div className="grid grid-cols-2 gap-10"><div><div className="text-xs text-ink mb-3">Typography</div><div className="font-d text-[2.4rem] leading-tight">Fraunces 38</div><div className="font-d text-[1.75rem]">Heading 28</div><div className="text-base mt-1">Plus Jakarta Sans 16, body text</div><div className="text-xs text-ink mt-1">Caption 12 · 8px spacing grid · 24px card radius</div></div>
<div><div className="text-xs text-ink mb-3">Components</div><div className="grid grid-cols-2 gap-3 w-[420px]"><${Btn}>Primary<//><${Btn} kind="o">Secondary<//><${Btn} kind="g">Highlight<//><${Btn} kind="c">Log out<//></div><div className="flex gap-2 mt-3"><span className="px-4 py-2 rounded-full bg-p text-white text-sm font-bold">Selected</span><span className="px-4 py-2 rounded-full bg-mist text-sm font-bold">Option</span><${Bars} w="w-10"/></div></div></div>
<p className="text-xs text-ink mt-8">Concept design with demo data. Not an official FCMB product.</p></div>`;
const Device=({children})=>html`<div className="dev relative overflow-hidden bg-mist flex flex-col w-full h-[calc(100dvh-48px)] md:w-[393px] md:h-[852px] md:rounded-[55px] md:shadow-[0_0_0_10px_#111,0_30px_80px_rgba(0,0,0,.5)]">${children}</div>`;
const useZ=()=>{const f=()=>window.innerWidth<768?1:Math.min(1,(window.innerHeight-48-40)/872);const[z,sz]=useState(f);useEffect(()=>{const r=()=>sz(f());window.addEventListener('resize',r);return()=>window.removeEventListener('resize',r)},[]);return z};
const App=()=>{const[v,setV]=useState('design');const[s,setS]=useState('splash');const[msg,setMsg]=useState('');const[big,setBig]=useState(false);const z=useZ();
useEffect(()=>{document.documentElement.style.fontSize=big?'18px':'16px'},[big]);
useEffect(()=>{if(!msg)return;const t=setTimeout(()=>setMsg(''),2300);return()=>clearTimeout(t)},[msg]);
const Sc=SCR.find(x=>x[0]===s)[2];const T=(k,l)=>html`<button onClick=${()=>{setV(k);setS('splash')}} aria-pressed=${v===k} className=${'px-4 min-h-[36px] rounded-md text-sm font-semibold '+(v===k?'bg-white text-[#2c2c2c]':'text-white/80')}>${l}</button>`;
return html`<${Ctx.Provider} value=${{toast:setMsg,big,setBig}}><div className="h-[100dvh] flex flex-col"><header className="h-12 shrink-0 bg-[#2c2c2c] text-white flex items-center justify-between px-4 text-sm"><div className="flex items-center gap-3 min-w-0"><${Bars} w="w-4"/><span className="font-semibold truncate">FCMB Pensions: App redesign</span><span className="hidden md:inline text-white/50">Draft</span></div><div className="flex bg-[#444] rounded-lg p-0.5">${T('design','Design')}${T('proto','Prototype')}</div><span className="hidden md:block text-white/60 w-44 text-right">iPhone 16 · 393 × 852</span></header>
${v==='design'?html`<div className="flex-1 overflow-auto" style=${{backgroundColor:'#e8e8e8',backgroundImage:'radial-gradient(#c9c9c9 1px,transparent 1px)',backgroundSize:'24px 24px'}}><div className="min-w-max p-16"><p className="text-sm text-[#555] mb-6">This view is for looking only. Open the Prototype tab at the top to click through the app.</p><${Guide}/><${Flow} a=${0} b=${5} t="Flow A: Get started, sign in and see your savings"/><${Flow} a=${5} b=${10} t="Flow B: Explore your pension"/></div></div>`:html`<div className="flex-1 flex min-h-0 bg-[#1e1e1e]"><aside className="hidden md:block w-60 shrink-0 p-4 text-white/80 overflow-auto"><div className="text-xs text-white/50 mb-2">Prototype flow</div>${SCR.map(([k,n],i)=>html`<button key=${k} onClick=${()=>setS(k)} className=${'w-full text-left min-h-[40px] px-3 rounded-md text-sm '+(s===k?'bg-white/15 text-white':'')}>${String(i+1).padStart(2,'0')} ${n}</button>`)}<button onClick=${()=>setS('splash')} className="w-full mt-4 min-h-[44px] rounded-md bg-p text-white font-bold text-sm">Restart</button><p className="text-xs text-white/50 mt-4">Click through the app like a real user. Demo data only. Not an official FCMB product.</p></aside><div className="flex-1 flex items-center justify-center overflow-auto"><div style=${{zoom:z}}><${Device}><${Chrome} cls="hidden md:block"/><${Sc} go=${setS} key=${s}/>${NAVS.includes(s)&&html`<${Nav} s=${s} go=${setS}/>`}${msg&&html`<div role="status" className="absolute left-5 right-5 bottom-24 z-50 bg-ob text-white rounded-2xl px-4 py-3 text-sm font-semibold fade">${msg}</div>`}<//></div></div></div>`}</div><//>`};
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
